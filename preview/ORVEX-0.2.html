 const id=session.backgroundArt(),changedProfile=lastProfile!==session.profile;lastProfile=session.profile;
 const base=document.querySelector('.bg-base'),next=document.querySelector('.bg-next');
 if(changedProfile){backgroundKey='';base.style.backgroundImage='none';next.style.backgroundImage='none';next.style.opacity=0}
 if(id!==backgroundKey){backgroundKey=id;const serial=++backgroundSerial;clearTimeout(backgroundTimer);
  if(!id){base.style.backgroundImage='none';next.style.backgroundImage='none';next.style.opacity=0}
  else {const img=new Image();img.onload=()=>{if(serial!==backgroundSerial)return;if(next.style.opacity==='1')base.style.backgroundImage=next.style.backgroundImage;next.style.transition='none';next.style.opacity=0;void next.offsetWidth;next.style.transition=session.motion||changedProfile?'none':'opacity 280ms ease';next.style.backgroundImage=`url('${ORVEX_BACKDROPS[id]}')`;next.style.opacity=1;backgroundTimer=setTimeout(()=>{if(serial!==backgroundSerial)return;base.style.backgroundImage=next.style.backgroundImage;next.style.transition='none';next.style.opacity=0},session.motion||changedProfile?0:290)};img.src=ORVEX_BACKDROPS[id]}
 }
 const feature=document.querySelector('#featured-game');if(feature){const e=session.featured();document.querySelectorAll('.recent').forEach(card=>card.classList.toggle('context-selected',session.showcase()[Number(card.dataset.index)]?.id===e?.id));feature.innerHTML=`<h1>${esc(e?.title||'Explora tu colección')}</h1><p class="hero-description">${esc(e?.description||'')}</p>${progressInfo(e?.progress)}${session.page===2?`<p class="hero-meta">${esc(e?.platform||'')} · ${e?age(e):''} · Disponibilidad demostrativa</p>`:''}`}
}
const age=e=>e.age===0?'General':e.age+'+';
const profileLabel=()=>session.profile==='child'?'Infantil':'Adulto';
const art=e=>ORVEX_ART[e.art];
const card=(e,i)=>`<button class="card" data-action="open" data-index="${i}" data-focus="card${i}"><img alt="" src="${art(e)}"><span class="badge">DEMO</span><strong>${e.favorite?'♥ ':''}${esc(e.title)}</strong><small>${esc(e.platform)} · ${age(e)}</small><small class="open">${e.progress?.source?'DEMO · '+esc(e.progress.percentLabel):'Abrir ficha →'}</small></button>`;
function resize(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}addEventListener('resize',resize);resize();
function focus(key){document.querySelector(`[data-focus="${key}"]`)?.focus()}
function go(p){session.navigate(p);message='';profileMenu=false;render();main.scrollTop=0;focus(p===3?'setting'+settingsCategory:'nav'+session.page)}
function detailPage(e){return `<section class="details"><div class="detail-footer">ORVEX OS 0.2 · ${profileLabel()} · Perfiles demostrativos sin PIN</div><button class="back" data-action="back" data-focus="back">← Volver</button><span class="eyebrow">FICHA / CONTENIDO DE DEMOSTRACIÓN</span><img class="cover" src="${art(e)}" alt="Portada de ${esc(e.title)}"><div class="info"><h1>${esc(e.title)}</h1><div class="meta">${esc(e.platform)} · ${age(e)}</div><p class="description">${esc(e.description)}</p><p class="availability">${esc(e.availability)}</p><div class="row"><button class="accent" data-action="play" data-focus="play">${e.kind==='game'?'Jugar':'Ver'} · DEMO</button><button data-action="favorite" data-focus="favorite">${e.favorite?'♥ Quitar de favoritos':'♡ Agregar a favoritos'}</button></div>${e.kind==='game'?progressInfo(e.progress):''}<p role="status" class="message">${esc(message)}</p></div></section>`}
function settingsPage(){let c=settingsCategory;let description=c===0?'FUNCIONAL · Preferencias guardadas en este navegador':c===3?'FUNCIONAL · Filtros y favoritos por perfil':c===4?'DEMO · Filtro infantil hasta 7+. Sin autenticación ni PIN.\nEl cambio de perfil es libre: no es un control parental seguro.':c===5?'FUNCIONAL · ORVEX OS 0.2 Visual Preview\nVista HTML autónoma. La aplicación Qt utiliza SQLite.\nTodo el catálogo es ficticio. Sin conexiones a servicios externos.':'FUTURO · Esta categoría no controla dispositivos.\nLa integración se desarrollará en una próxima fase.';
return `<h1>Configuración</h1><div class="settings"><div class="categories">${categories.map((n,i)=>`<button class="${c===i?'selected':''}" data-action="settings" data-index="${i}" data-focus="setting${i}">${n}</button>`).join('')}</div><section class="panel"><h2>${categories[c]}</h2><p class="${c===1||c===2?'future':''}">${description}</p>${c===0?`<button class="wide" data-action="motion" data-focus="motion">Reducir movimiento: ${session.motion?'Sí':'No'}</button><div class="background-modes">${['dynamic','fixed','default'].map(mode=>`<button data-action="background" data-mode="${mode}" data-focus="bg${mode}" class="${session.backgroundMode===mode?'selected':''}">${({dynamic:'Fondo dinámico',fixed:'Fondo fijo',default:'Predeterminado'})[mode]}</button>`).join('')}</div>${session.backgroundMode==='fixed'?`<select aria-label="Fondo fijo" id="fixed-background">${session.backgroundOptions().map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('')}</select>`:''}`:c===3?'<button class="wide" data-action="clear" data-focus="clear">Limpiar filtros de las bibliotecas</button>':c===4?`<div class="row"><button class="${session.profile==='adult'?'selected':''}" data-action="adult" data-focus="adult">Adulto · demo</button><button class="${session.profile==='child'?'selected':''}" data-action="child" data-focus="child">Infantil · demo</button></div>`:''}<p role="status" class="message">${esc(message)}</p></section></div>`}
function render(focusKey=null,caret=null){
 const oldFocus=focusKey||document.activeElement?.dataset.focus;
 document.body.classList.toggle('reduced',session.motion);
 nav.innerHTML=names.map((n,j)=>{const i=j+1;return `<button class="${session.page===i?'selected':''}" ${session.page===i?'aria-current="page"':''} data-action="nav" data-index="${i}" data-focus="nav${i}">${n}</button>`}).join('');
 document.querySelector('#profile').innerHTML=`<img alt="" src="${ORVEX_ICONS.profile}">`;
 document.querySelector('#profile').setAttribute('aria-label','Perfil '+profileLabel());
 document.querySelector('#profile').setAttribute('aria-expanded',String(profileMenu));
 document.querySelector('#profile-menu').innerHTML=profileMenu?`<p>PERFIL · DEMO SIN PIN</p><button data-action="adult" data-focus="adult">Adulto</button><button data-action="child" data-focus="child">Infantil</button>`:'';
 document.querySelector('#profile-menu').hidden=!profileMenu;
 document.querySelector('#storage').textContent=session.persistent?'':'Guardado no disponible: preferencias de esta sesión';
 const e=session.detail(),entries=session.entries();main.className=e?'detail':session.page===3?'':'console';document.querySelector('header').inert=!!e;document.querySelector('header').style.visibility=e?'hidden':'visible';document.querySelector('footer').hidden=!!e;
 if(e)main.innerHTML=detailPage(e);
 else if(session.page===3)main.innerHTML=settingsPage();
 else{main.innerHTML=`<section class="console-hero"><div class="eyebrow">${session.page===2?'PARA VER · CATÁLOGO DEMO':'RECIENTES · VISTA HTML DEMOSTRATIVA'}</div><section class="recent-strip" aria-label="${session.page===2?'Selección multimedia':'Juegos recientes'}">${session.showcase().map((e,i)=>card(e,i).replace('data-action="open"','data-action="recent"').replace('data-focus="card','data-focus="recent').replace('class="card"','class="card recent"')).join('')}</section><div id="featured-game"></div><button class="accent" data-action="continue" data-focus="continue">${session.page===2?'Ver ficha · DEMO':'Continuar jugando · DEMO'}</button><button data-action="explore" data-focus="explore">Biblioteca completa ↓</button></section><section id="full-library"><h2>${session.page===2?'Biblioteca multimedia':'Biblioteca de videojuegos'}</h2><p class="subtitle">Catálogo ficticio · Explora, guarda y descubre</p><div class="toolbar"><input type="search" aria-label="Buscar por nombre" placeholder="Buscar por nombre…" data-focus="search"><select aria-label="${session.page===2?'Tipo':'Plataforma'}" data-focus="filter">${session.options().map(o=>`<option>${esc(o)}</option>`).join('')}</select><button data-action="favorites" data-focus="favorites" class="${session.state().favorites?'selected':''}">${session.state().favorites?'♥ Solo favoritos':'♡ Todos los títulos'}</button><button data-action="clear" data-focus="clear">Limpiar filtros</button></div><p class="count" aria-live="polite">${entries.length} títulos · ${profileLabel()} (demo)</p><section class="cards" aria-label="Títulos de demostración">${entries.length?entries.map(card).join(''):'<div class="empty">No hay títulos con estos filtros.<br>Prueba otra búsqueda o limpia los filtros.</div>'}</section></section>`;const input=main.querySelector('input');input.value=session.state().query;main.querySelector('select').value=session.state().category;
 input.addEventListener('input',event=>{const pos=event.target.selectionStart;session.setQuery(event.target.value);render('search',pos)});
 input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();focus('card'+session.state().index)}});
 main.querySelector('select').addEventListener('change',event=>{session.setCategory(event.target.value);render('filter')});}
 const fixed=main.querySelector('#fixed-background');if(fixed){fixed.value=session.fixedBackground;fixed.onchange=e=>{session.setFixedBackground(e.target.value);updateVisual()}}
 updateVisual();
 if(oldFocus)focus(oldFocus);if(caret!==null){const input=main.querySelector('input');if(input){try{input.setSelectionRange(caret,caret)}catch{}}}
}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,i=Number(b.dataset.index);message='';
 if(a==='continue'||a==='recent'){returnScroll=main.scrollTop;returnFocus=b.dataset.focus;session.openTitle(a==='recent'?session.showcase()[i].id:session.featured()?.id);render('back');return}if(a==='nav'){go(i);return}if(a==='open'){returnScroll=main.scrollTop;returnFocus=b.dataset.focus;session.open(i);render('back');return}if(a==='back'){session.close();render(returnFocus);main.scrollTop=returnScroll;return}
 if(a==='background'){session.setBackgroundMode(b.dataset.mode)}else if(a==='profile'){profileMenu=!profileMenu;render(profileMenu?'adult':'profile');return}else if(a==='adult'||a==='child'){session.setProfile(a);profileMenu=false}else if(a==='favorite'){session.toggleFavorite(session.detail().id)}else if(a==='favorites'){session.toggleFavorites()}else if(a==='clear'){session.clearFilters();if(session.page===3)message='Filtros restablecidos. Tus favoritos se conservan.'}else if(a==='motion'){session.toggleMotion()}else if(a==='play'){message='Vista HTML: no puede importar ni ejecutar juegos locales. Usa la aplicación Qt para la biblioteca real.'}else if(a==='settings'){settingsCategory=i}else if(a==='explore'){document.querySelector('#full-library').scrollIntoView({behavior:session.motion?'instant':'smooth'});focus('search');return}render(b.dataset.focus);
});
addEventListener('keydown',event=>{const target=event.target;
 if(event.key==='Escape'){event.preventDefault();if(profileMenu){profileMenu=false;render('profile')}else if(message){message='';render()}else if(session.detail()){session.close();render(returnFocus);main.scrollTop=returnScroll}else go(1);return}
 if(!event.key.startsWith('Arrow'))return;
 if(target.matches('input,select')){if(target.matches('input')&&event.key==='ArrowDown'){event.preventDefault();focus('card'+session.state().index)}return}
 if(target.dataset.action==='nav'&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();go(Number(target.dataset.index)===1?2:1);return}
 if(target.dataset.action==='nav'&&event.key==='ArrowDown'){event.preventDefault();focus(session.page===3?'setting'+settingsCategory:'recent0');return}
 if(target.classList.contains('recent')){event.preventDefault();const i=Number(target.dataset.index);if(event.key==='ArrowDown'){focus('continue');return}if(event.key==='ArrowUp'){focus('nav'+session.page);return}focus('recent'+Math.max(0,Math.min(session.showcase().length-1,i+(event.key==='ArrowRight'?1:-1))));return}
 if(target.classList.contains('card')){event.preventDefault();const i=Number(target.dataset.index);if(event.key==='ArrowUp'&&i<4){focus('search');return}const d={ArrowRight:1,ArrowLeft:-1,ArrowDown:4,ArrowUp:-4}[event.key];const next=Math.max(0,Math.min(session.entries().length-1,i+d));session.select(next);focus('card'+next);return}
 const buttons=[...document.querySelectorAll('button,input,select')].filter(x=>!x.disabled&&!x.closest('[inert]')&&x.getClientRects().length),i=buttons.indexOf(target);if(i>=0){event.preventDefault();buttons[(i+(event.key==='ArrowRight'||event.key==='ArrowDown'?1:buttons.length-1))%buttons.length].focus()}
});
document.addEventListener('focusin',event=>{const card=event.target.closest('.card');if(card){session.focus((card.classList.contains('recent')?session.showcase():session.entries())[Number(card.dataset.index)].id);updateVisual()}});
document.addEventListener('mouseover',event=>{const card=event.target.closest('.card');if(card){session.focus((card.classList.contains('recent')?session.showcase():session.entries())[Number(card.dataset.index)].id);updateVisual()}});
render();focus('nav1');
</script></html>
