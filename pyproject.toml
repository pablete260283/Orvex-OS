[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "orvex-entertainment-os"
version = "0.2.0"
description = "ORVEX OS console launcher and offline visual preview"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3"]
[project.scripts]
orvex-preview = "orvex.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
orvex = ["ui/*.qml", "ui/components/*.qml", "ui/pages/*.qml", "ui/assets/*.svg", "core/*.json", "ui/assets/brand/svg/*.svg", "ui/assets/brand/png/*.png", "ui/assets/brand/*.md", "ui/assets/brand/*.json"]

# Gradual adoption: audited modules first, without reformatting all legacy UI glue.
[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/orvex/__main__.py", "src/orvex/core/store.py", "src/orvex/core/library.py", "src/orvex/core/installed.py", "src/orvex/core/launcher.py", "tests/test_audit.py", "tests/artifacts.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
