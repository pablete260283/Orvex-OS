[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "orvex-entertainment-os"
version = "0.1.0"
description = "ORVEX Entertainment OS visual preview"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3"]
[project.scripts]
orvex-preview = "orvex.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
orvex = ["ui/*.qml", "ui/components/*.qml", "ui/assets/*.svg", "core/*.json"]
