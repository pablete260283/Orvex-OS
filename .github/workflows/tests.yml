name: Preview checks
on:
  workflow_dispatch:
  push:
    branches:
      - feature/orvex-0.4-controller-manager
  pull_request:
    branches:
      - main
      - feature/orvex-0.3.3
concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qt-preview:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/build_web_preview.py
      - run: python -m unittest discover -s tests -v
        env:
          ORVEX_CAPTURE_DIR: ${{ runner.temp }}/orvex-captures
      - run: node --test tests/test_web_model.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-preview-captures
          path: |
            ${{ runner.temp }}/orvex-captures/**/*.png

  windows-regression:
    # This validates Windows imports, Qt offscreen, and portable tests only.
    # Linux-only C fixtures are explicitly skipped by tests/real_fixture.py.
    timeout-minutes: 15
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
        env:
          ORVEX_CAPTURE_DIR: ${{ runner.temp }}/orvex-captures
      - run: node --test tests/test_web_model.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-regression-captures
          path: ${{ runner.temp }}/orvex-captures/**/*.png
          if-no-files-found: ignore
