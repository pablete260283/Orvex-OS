name: Preview checks
on:
  workflow_dispatch:
  push:
    branches:
      - feature/orvex-0.4-controller-manager
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  qt-preview:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONPATH: src
      ORVEX_CAPTURE_DIR: ${{ runner.temp }}/orvex-captures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/build_web_preview.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_web_model.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: qt-preview-captures
          path: |
            ${{ runner.temp }}/orvex-captures/**/*.png
